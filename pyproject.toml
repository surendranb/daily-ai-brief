[project]
name = "daily-ai-brief"
version = "0.1.2"
description = "Dedicated Daily AI Intelligence, Research, Frontier Models & Podcast Digest Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Surendran B", email = "reachsuren@gmail.com" }]
keywords = ["mcp", "ai", "intelligence", "arxiv", "podcasts", "llm", "frontier-models", "digest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
publish = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.urls]
Homepage = "https://github.com/surendranb/daily-ai-brief"
Repository = "https://github.com/surendranb/daily-ai-brief"
Issues = "https://github.com/surendranb/daily-ai-brief/issues"

[project.scripts]
daily-ai-brief = "daily_ai_brief.server:main"
daily-ai-brief-mcp = "daily_ai_brief.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
